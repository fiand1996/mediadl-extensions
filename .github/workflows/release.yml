name: Build and Publish Extensions

on:
  push:
    branches: [main]
    paths:
      - "src/core/**"
      - "src/extensions/**"
      - "scripts/build.ts"
      - "package.json"
      - "package-lock.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Type Check
        run: npm run type-check

      - name: Build All Extensions & Manifest Index
        run: npm run build

      - name: Deploy to GitHub Pages / Repo Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: repo
          keep_files: false
